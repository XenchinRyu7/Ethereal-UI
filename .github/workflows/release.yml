name: Release @etherealui/react & @etherealui/cli to NPM

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build & Publish @etherealui Packages (Tag Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      HUSKY: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js & NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint & Typecheck Packages
        run: |
          pnpm --filter @etherealui/react lint
          pnpm --filter @etherealui/cli lint

      - name: Build @etherealui/react & @etherealui/cli
        run: |
          pnpm --filter @etherealui/react build
          pnpm --filter @etherealui/cli build

      - name: Sync Tag Version with Package Versions
        run: |
          RAW_TAG="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            for PKG_PATH in "./packages/ui/package.json" "./packages/cli/package.json"; do
              PKG_VERSION=$(node -p "require('${PKG_PATH}').version")
              if [[ "${RAW_TAG}" != "${PKG_VERSION}" ]]; then
                echo "Syncing ${PKG_PATH} version to tag ${RAW_TAG}..."
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('${PKG_PATH}', 'utf8'));
                  pkg.version = '${RAW_TAG}';
                  fs.writeFileSync('${PKG_PATH}', JSON.stringify(pkg, null, 2) + '\n');
                "
              fi
            done
          fi

      - name: Publish @etherealui/react & @etherealui/cli to NPM Registry (--access public)
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if npm view "@etherealui/react@${UI_VERSION}" version > /dev/null 2>&1; then
            echo "@etherealui/react@${UI_VERSION} is already published on NPM."
          else
            echo "Publishing @etherealui/react@${UI_VERSION} to NPM with --access public..."
            pnpm --filter @etherealui/react publish --access public --no-git-checks
          fi

          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@etherealui/cli@${CLI_VERSION}" version > /dev/null 2>&1; then
            echo "@etherealui/cli@${CLI_VERSION} is already published on NPM."
          else
            echo "Publishing @etherealui/cli@${CLI_VERSION} to NPM with --access public..."
            pnpm --filter @etherealui/cli publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
