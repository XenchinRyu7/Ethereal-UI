name: Release @etherealui/react to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build & Publish @etherealui/react
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Configure NPM Authentication & Public Access
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm config set access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build @etherealui/react Package
        run: pnpm --filter @etherealui/react build

      - name: Create Release Pull Request or Publish to NPM via Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm --filter @etherealui/react build && pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_ACCESS: public

      - name: Ensure Initial Release v0.0.1 is Published to NPM (--access public)
        if: steps.changesets.outputs.published != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if npm view "@etherealui/react@${PKG_VERSION}" version > /dev/null 2>&1; then
            echo "@etherealui/react@${PKG_VERSION} is already published on NPM."
          else
            echo "Publishing initial @etherealui/react@${PKG_VERSION} to NPM with --access public..."
            pnpm --filter @etherealui/react publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

